[유전 상담 및 PGT] NF1은 상염색체 우성 유전으로 환자의 자녀에게 유전될 확률은 50%입니다(성별 무관). PGT(착상전 유전자 검사/Preimplantation Genetic Testing)는 시험관 아기(IVF) 시술 중 배아의 유전자를 검사하여 NF1 돌연변이가 없는 배아만 선별하여 이식하는 방법입니다. 산전검사(양수검사/융모막검사)를 통해 임신 중 태아의 NF1 유전자 돌연변이도 확인 가능합니다(가족 내 돌연변이가 먼저 확인되어 있어야 함). 대학병원 유전학과나 희귀질환 전문 클리닉에서 유전 상담을 받을 수 있습니다. 아이가 성에 관심을 갖는 시기부터 미래 자녀에 대한 50% 유전 가능성을 자연스럽게 알려주고 성교육이 필요합니다.

[부모 가이드] 8세 이상이면 아이는 자신의 상태를 어느 정도 알고 있습니다. 자녀에게 알리는 것이 신뢰/독립성/적응을 높입니다. 충분히 알아보고 감정을 정리한 후 차분하고 인내심 있게, 개인적 공간에서, 솔직하게, 긍정적으로 대화하세요. 출생~2세는 간단한 연결, 3~7세는 사실 중심적, 8~11세는 앞으로 나타날 특징, 12~19세는 정체성 형성에 초점을 맞추세요.
사춘기 고려사항: 신체적·호르몬적 변화가 큰 시기로, 총상신경섬유종이 더 뚜렷해질 수 있고, 피부 병변/신체 변형으로 우울감, 위축, 대인기피를 겪을 수 있습니다. 정기적 정신건강 평가와 상담이 중요합니다. 소셜 미디어 사용을 대화로 관찰하고, 부상 위험 활동은 피하되 아이가 잘 성장할 활동을 권장하세요. 중학교/고등학교 전환 시 학습 차이와 기대치 증가로 어려움이 커질 수 있어 지역사회 프로그램을 활용하세요.
부모 자기 돌봄: NF는 누구의 잘못도 아닙니다. 죄책감을 느끼지 마세요. 비슷한 경험의 가족을 만나고, 온라인 활동이나 지역사회 행사에 참여하세요. 필요하면 정신건강 상담을 받으세요.

[연령별 관리] 영유아기(0~2세): 피부 증상과 성장 발달 평가가 핵심. 카페오레 반점 관찰, 6개 이상이면 유전적 평가 고려. NF1 가족력 있으면 유전자 검사로 조기 진단 가능. 운동발달 지연이나 시각계 이상도 관찰. 총상신경섬유종이 이 시기에 발견되기도 함.
학령전기(3~6세): 피부 병변 증가, 행동발달 관찰, 시신경교종 여부 평가 중요. ADHD나 자폐 스펙트럼 초기 징후 관찰. 발달검사, 행동검사로 인지/사회성 발달 정기 평가. 정기적 안과 검진 및 뇌 MRI 권장.
조기 학령기(7~10세): 인지 기능, 학습능력, 정서적 적응 평가가 매우 중요. 학습장애(LD)나 ADHD가 학업에 영향. 심리검사, 지능검사 통해 특수교육/치료적 개입 연계. 피부 신경섬유종 나타나기 시작, 척추측만증 모니터링.
후기 학령기(11세+): 사춘기 변화, 종양 진행 여부 모니터링 핵심. 악성 전환 조짐 시 MRI와 조직검사. 정신건강 평가(우울, 위축, 대인기피), 고혈압/내분비 이상 관찰, 소아내분비과 병행 진료.

[학교생활] 학교 선생님과 미리 NF 상태, 주의점, 진료일정을 소통하세요. ADHD/학습장애시 IEP 요청, 학습보조도구, 좌석배치 조정(시력), 체육활동 맞춤화, 휴식제공, 정서적 지지가 필요합니다. 외모 기반 따돌림 예방, 자존감 강화(작은 성공 경험), 정기 검진 연계(뇌MRI/시력/정형외과)가 중요합니다.
교직원 관리사항: 학습/인지 저하 이해(NF1 아동의 약 절반이 ADHD, LD, 실행기능 장애 경험), 시력 저하 고려(칠판 잘 보이는 좌석, 시각자료 확대), 피부/외모 변화에 대한 교우관계 지도(따돌림 예방), 체육활동 맞춤 배려(척추측만증/골격기형/근력약화 고려), 피로/통증 관찰(휴식 유도), 정서적 지지(자기효능감 향상, 구체적 성취 경험 격려), 응급상황 시 학부모/병원 연락 체계 확보.
가정생활 관리: 정기검진(뇌MRI/시력/정형외과), 숙제부담 완화(양보다 질), 생활지도 계획(예측 가능한 일과), 자존감 향상(가정-학교 연계, 칭찬 문화), 가정 내 정서적 지지(불안/자존감 저하/사회적 위축 이해).

[학교폭력 대처] 유형: 신체적/경제적/정서적/언어적/사이버/외모기반 괴롭힘. NF 아이들은 카페오레반점, 종양, 의료기기 등 외형적 특이성으로 인해 특히 외모 기반 괴롭힘의 대상이 될 수 있습니다.
가정에서의 징후: 표정 어두움, 학교 거부, 이유 없는 결석, 몸에 상처/멍, 절망감 표현, 말수 적어짐, 불필요한 물건 요구.
학교에서의 징후: 활동에서 소외, 혼자만의 공간에 머무름, 단체활동 참여 거부, 잦은 지각/조퇴/결석.
사이버폭력 징후: 불안하게 휴대폰 확인, 단체 채팅방에서 반복 공격, 온라인 기기 사용료 급증, SNS 분위기 급변, 갑자기 휴대전화 끄기/SNS 탈퇴.
신고절차: 1.학교에 신고(117전화/직접) → 2.즉시 보호조치(분리/상담/치료) → 3.사안조사(피해/가해학생 면담) → 4.학교폭력대책심의위원회 심의. 학교 처리에 동의하지 않으면 교육지원청 재심, 행정소송, 경찰신고 가능.
부모 조언: 듣고 지지해주기(아이 이야기를 충분히 들어주세요), 학교와 협력(사건 문서화, 지원 요청, 재발 방지), 권리 이해(학교폭력 관련 법률), 사이버 괴롭힘 대응(디지털 안전 전략, 증거 보존).
회복: "내 잘못 아님" 반복 확인, 작은 성공 경험 쌓기, 신뢰할 수 있는 어른 1명 이상, 감정 표현 격려, 신체 활동(산책/스트레칭/운동), 비교하지 않기, "회복 중인 사람"으로 인식.

                            <button
                                className="settings-button"
                                onClick={() => setShowSettings(true)}
                                title="설정"
                            >
                                ⚙️
                            </button>
                        </div>
                    </div>

                    <SettingsModal
                        isOpen={showSettings}
                        onClose={() => setShowSettings(false)}
                        onSetApiKey={setApiKey}
                        hasApiKey={!!apiKey}
                        mode={mode}
                    />

                    <div className="chat-area">
                        {mode === 'ai' && (
                            <div className="ai-mode-notice">
                                🤖 AI 모드로 실행 중입니다. Gemini가 자연스러운 답변을 제공합니다.
                            </div>
                        )}

                        {showWelcome && (
                            <div className="welcome-section">
                                <div className="welcome-icon">🤝</div>
                                <div className="welcome-title">안녕하세요!</div>
                                <div className="welcome-text">
                                    END NF 신경섬유종증 환우회 안내 챗봇입니다. 신경섬유종증에 대해 궁금한 점을 자유롭게 물어보세요.
                                </div>
                                <div className="category-label">주요 주제</div>
                                <div className="categories-grid">
                                    {categories.map(cat => (
                                        <button
                                            key={cat.key}
                                            className="category-button"
                                            onClick={() => handleCategoryClick(cat.key)}
                                        >
                                            <span className="category-icon">{cat.icon}</span>
                                            <span>{cat.label}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {messages.map((msg, idx) => (
                            <div key={idx} className={`message ${msg.type}`}>
                                <div className="message-bubble">
                                    <div>{msg.text}</div>
                                    {msg.relatedQuestions && msg.relatedQuestions.length > 0 && (
                                        <div className="related-questions">
                                            {msg.relatedQuestions.map((q, i) => (
                                                <button
                                                    key={i}
                                                    className="related-question-button"
                                                    onClick={() => handleRelatedQuestion(q)}
                                                >
                                                    {q}
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                    {msg.showCategories && (
                                        <div style={{ marginTop: '12px', paddingTop: '12px', borderTop: '1px solid rgba(107, 175, 71, 0.2)' }}>
                                            <div style={{ fontSize: '12px', marginBottom: '8px', fontWeight: '500' }}>다음 중 선택하세요:</div>
                                            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
                                                {categories.map(cat => (
                                                    <button
                                                        key={cat.key}
                                                        className="related-question-button"
                                                        onClick={() => handleCategoryClick(cat.key)}
                                                    >
                                                        {cat.icon} {cat.label}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        ))}

                        {isLoading && (
                            <div className="message bot">
                                <div className="typing-indicator">
                                    <div className="typing-dot"></div>
                                    <div className="typing-dot"></div>
                                    <div className="typing-dot"></div>
                                </div>
                            </div>
                        )}

                        {apiError && (
                            <div className="error-message">
                                ⚠️ {apiError}
                            </div>
                        )}

                        <div ref={messagesEndRef} />
                    </div>

                    <div className="input-area">
                        <form onSubmit={handleSendMessage} style={{ display: 'flex', gap: '10px', width: '100%' }}>
                            <div className="input-wrapper">
                                <input
                                    type="text"
                                    value={inputValue}
                                    onChange={(e) => setInputValue(e.target.value)}
                                    placeholder="궁금한 내용을 입력하세요..."
                                    autoFocus
                                />
                            </div>
                            <button type="submit" className="send-button" disabled={isLoading}>
                                →
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<ChatBot />, document.getElementById('root'));
    </script>
</body>
</html>
