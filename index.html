신경섬유종증은 신경과 피부, 그리고 기타 다양한 장기에 영향을 주는 유전 질환으로, 신경피부증후군(neurocutaneous syndrome) 중 가장 흔한 질환입니다. 대표적인 유형은 신경섬유종증 제1형(NF1)이며 전체의 약 90% 이상을 차지합니다.
